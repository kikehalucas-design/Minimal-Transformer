name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalTransformer-Windows-VST3
          path: build/MinimalTransformer_artefacts/Release/VST3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc sign
        run: codesign --force --deep -s - build/MinimalTransformer_artefacts/Release/VST3/MinimalTransformer.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalTransformer-macOS-VST3
          path: build/MinimalTransformer_artefacts/Release/VST3
